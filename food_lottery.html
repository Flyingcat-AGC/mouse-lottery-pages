<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鱼饲料摇摇车</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:linear-gradient(135deg,#e0f7fa 0%,#b2ebf2 40%,#e8f5e9 100%);
  min-height:100vh;padding:0 0 60px;
}
.bg-deco{position:fixed;font-size:3.5rem;opacity:.08;pointer-events:none;z-index:0;animation:float 8s ease-in-out infinite}
.bg-deco.tl{top:4%;left:2%}
.bg-deco.tr{top:4%;right:2%;animation-delay:2s}
.bg-deco.bl{bottom:8%;left:2%;animation-delay:4s}
.bg-deco.br{bottom:8%;right:2%;animation-delay:6s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

.header{text-align:center;padding:32px 16px 8px;position:relative;z-index:1}
.header h1{font-size:1.9rem;color:#0277bd;font-weight:900;letter-spacing:2px}
.header .sub{margin-top:6px;color:#0288d1;font-size:.88rem}
.deco-row{text-align:center;font-size:1.4rem;letter-spacing:6px;margin:6px 0 12px}

.phase-tabs{display:flex;justify-content:center;gap:12px;margin:0 16px 20px;position:relative;z-index:1}
.phase-tab{flex:1;max-width:200px;padding:10px 16px;border-radius:50px;border:2px solid transparent;background:rgba(255,255,255,.5);color:#888;font-size:.88rem;font-weight:700;text-align:center;transition:all .3s}
.phase-tab.active{background:linear-gradient(135deg,#4fc3f7,#0288d1);color:#fff;border-color:#0288d1;box-shadow:0 3px 14px rgba(2,136,209,.3)}
.phase-tab.done{background:#a5d6a7;color:#2e7d32;border-color:#81c784}

.grid-section{position:relative;z-index:1;padding:0 12px}
.section-title{text-align:center;font-size:.78rem;font-weight:700;color:#0288d1;letter-spacing:2px;margin-bottom:10px}
.prize-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
@media(max-width:400px){.prize-grid{grid-template-columns:repeat(3,1fr)}}

.prize-card{background:rgba(255,255,255,.75);border-radius:16px;padding:10px 6px 8px;text-align:center;border:2px solid transparent;box-shadow:0 4px 18px rgba(2,136,209,.13);transition:all .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.prize-card.lit{background:linear-gradient(135deg,#fff9c4,#ffe082);border-color:#ffd740;box-shadow:0 0 18px rgba(255,213,64,.7);transform:scale(1.04);z-index:2}
.prize-card.won{background:linear-gradient(135deg,#b2dfdb,#80cbc4);border-color:#26a69a;box-shadow:0 0 20px rgba(38,166,154,.5);transform:scale(1.06)}
.prize-card .icon{font-size:1.5rem;margin-bottom:3px}
.prize-card .name{font-size:.65rem;font-weight:700;color:#0277bd;line-height:1.3}
.prize-card .spec{font-size:.57rem;color:#888;margin-top:2px}
.prize-card .qty{display:inline-block;margin-top:3px;background:rgba(2,136,209,.1);border-radius:10px;padding:1px 7px;font-size:.58rem;color:#0288d1}

.ctrl-area{text-align:center;padding:0 16px 16px;position:relative;z-index:1}
.draw-counter{margin-bottom:10px;font-size:.82rem;color:#0288d1;font-weight:600}
.draw-counter span{display:inline-block;background:rgba(255,255,255,.7);border-radius:50px;padding:4px 14px;border:1.5px solid #b2ebf2}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 28px;border:none;border-radius:50px;font-size:1rem;font-weight:800;cursor:pointer;transition:all .2s;letter-spacing:1px;box-shadow:0 4px 14px rgba(0,0,0,.13)}
.btn:active{transform:scale(.94)}
.btn-draw{background:linear-gradient(135deg,#4fc3f7,#0288d1);color:#fff}
.btn-draw:disabled{background:#ccc;cursor:default;box-shadow:none}
.btn-phase2{background:linear-gradient(135deg,#ff8a65,#f4511e);color:#fff;display:none}

.result-box{margin:0 16px 16px;background:rgba(255,255,255,.8);border-radius:16px;padding:14px 16px;box-shadow:0 4px 18px rgba(2,136,209,.13);text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;position:relative;z-index:1}
.result-box.show{display:block}
.result-box .result-label{font-size:.75rem;color:#888;margin-bottom:4px}
.result-slot{background:linear-gradient(135deg,#e0f7fa,#b2ebf2);border:2px solid #4fc3f7;border-radius:12px;padding:8px 16px;font-size:.92rem;font-weight:800;color:#0277bd;min-width:120px;text-align:center;display:none;margin:6px auto}
.result-slot.show{display:block}
.result-slot.pulse{animation:pulse .5s ease-in-out}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}

.divider{display:flex;align-items:center;gap:10px;margin:10px 16px 16px;position:relative;z-index:1}
.divider hr{flex:1;border:none;border-top:2px dashed #b2ebf2}
.divider span{font-size:.8rem;color:#0288d1;white-space:nowrap;font-weight:700}

.phase2-section{margin:0 16px 16px;background:rgba(255,255,255,.82);border-radius:16px;padding:18px 16px 16px;box-shadow:0 4px 18px rgba(2,136,209,.13);text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;position:relative;z-index:1;border:2px solid #ff8a65}
.phase2-section.show{display:block}
.phase2-title{font-size:1rem;font-weight:900;color:#f4511e;margin-bottom:4px}
.phase2-desc{font-size:.75rem;color:#888;margin-bottom:14px}

.number-wheel{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.num-cell{width:52px;height:58px;border-radius:12px;background:rgba(244,241,235,.9);border:2px solid #ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;color:#555;transition:all .15s;position:relative}
.num-cell .prob-tiny{font-size:.5rem;font-weight:400;color:#aaa;position:absolute;bottom:3px;line-height:1}
.num-cell.lit{background:linear-gradient(135deg,#fff9c4,#ffe082);border-color:#ffd740;color:#e65100;box-shadow:0 0 14px rgba(255,193,7,.7);transform:scale(1.1)}
.num-cell.won-num{background:linear-gradient(135deg,#ff8a65,#f4511e);border-color:#bf360c;color:#fff;box-shadow:0 0 20px rgba(244,81,30,.5);transform:scale(1.15)}

.phase2-result{font-size:1.2rem;font-weight:900;color:#f4511e;margin:10px 0 4px;display:none}
.phase2-result.show{display:block;animation:pulse .5s ease-in-out}
.phase2-result-detail{font-size:.78rem;color:#888;display:none}
.phase2-result-detail.show{display:block}

.prob-section{margin:0 16px 16px;position:relative;z-index:1}
.prob-header{text-align:center;font-size:.72rem;color:#0288d1;font-weight:700;margin-bottom:8px;letter-spacing:1px}
.prob-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prob-item{background:rgba(255,255,255,.65);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:7px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.prob-label{font-size:.65rem;color:#333;flex:1;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prob-bar-wrap{width:60px;height:6px;background:#e0e0e0;border-radius:3px;flex-shrink:0}
.prob-bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#4fc3f7,#0288d1);transition:width .8s}
.prob-pct{font-size:.62rem;color:#0288d1;font-weight:700;width:32px;text-align:right;flex-shrink:0}

.record-section{margin:0 16px;position:relative;z-index:1}
.record-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.record-header h3{font-size:.85rem;font-weight:900;color:#0277bd}
.record-header .stat{font-size:.72rem;color:#888}
.record-btns{display:flex;gap:6px}
.btn-sm{padding:4px 12px;border-radius:20px;border:none;font-size:.7rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-sm:active{transform:scale(.93)}
.btn-export{background:#4fc3f7;color:#fff}
.btn-clear{background:#ffcdd2;color:#c62828}
.record-table-wrap{overflow-x:auto;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.85);font-size:.7rem}
thead tr{background:linear-gradient(135deg,#e0f7fa,#b2ebf2)}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid #e0f7fa;white-space:nowrap}
th{font-weight:800;color:#0277bd;font-size:.67rem}
td{color:#444}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even) td{background:rgba(224,247,250,.35)}
.badge{display:inline-block;border-radius:8px;padding:2px 7px;font-size:.63rem;font-weight:700}
.badge-blue{background:#e1f5fe;color:#0277bd}
.badge-amber{background:#fff8e1;color:#e65100}
.badge-green{background:#e8f5e9;color:#2e7d32}
.badge-red{background:#fce4ec;color:#c62828}
.empty-tip{text-align:center;color:#bbb;padding:18px;font-size:.8rem}
</style>
</head>
<body>

<div class="bg-deco tl">🐟</div>
<div class="bg-deco tr">🫧</div>
<div class="bg-deco bl">🐠</div>
<div class="bg-deco br">🌊</div>

<div class="header">
  <h1>🐟 鱼饲料摇摇车</h1>
  <p class="sub">摇出你的专属鱼粮~</p>
</div>
<div class="deco-row">🐟 🐠 🫧 🐡 🐟</div>

<div class="phase-tabs">
  <div class="phase-tab active" id="tab1">① 第一阶段：饲料抽奖</div>
  <div class="phase-tab" id="tab2">② 第二阶段：数字抽签</div>
</div>

<div class="grid-section">
  <div class="section-title">🎴 饲料品类（按数量加权抽取）</div>
  <div class="prize-grid" id="prizeGrid"></div>
</div>

<div class="ctrl-area">
  <div class="draw-counter"><span id="drawCounter">第一阶段：可抽 <b>1</b> 次，已抽 <b>0</b> 次</span></div>
  <div class="btn-row">
    <button class="btn btn-draw" id="btnDraw" onclick="doDraw()">🎯 摇一摇</button>
  </div>
</div>

<div class="result-box" id="resultBox">
  <div class="result-label">🎉 本轮抽奖结果</div>
  <div class="result-slot" id="slot1"></div>
</div>

<div class="divider">
  <hr><span>✨ 第一阶段完成后解锁第二阶段</span><hr>
</div>

<div style="text-align:center;position:relative;z-index:1;margin-bottom:16px;">
  <button class="btn btn-phase2" id="btnPhase2" onclick="startPhase2()">🎲 进入第二阶段 →</button>
</div>

<div class="phase2-section" id="phase2Section">
  <div class="phase2-title">🎲 第二阶段：数字抽签</div>
  <div class="phase2-desc">1-5 随机数，数字越大概率越大 · 仅限抽取 1 次</div>
  <div class="number-wheel" id="numWheel"></div>
  <button class="btn btn-draw" id="btnDraw2" onclick="doPhase2Draw()" style="margin-bottom:10px;">🎲 抽取数字</button>
  <div class="phase2-result" id="phase2Result"></div>
  <div class="phase2-result-detail" id="phase2Detail"></div>
</div>

<div class="prob-section">
  <div class="prob-header">📊 第一阶段概率分布</div>
  <div class="prob-grid" id="probGrid"></div>
</div>

<div class="record-section">
  <div class="record-header">
    <div>
      <h3>📋 抽奖记录</h3>
      <div class="stat" id="recordStat">共 0 次抽奖</div>
    </div>
    <div class="record-btns">
      <button class="btn-sm btn-export" onclick="exportCSV()">⬇ 导出</button>
      <button class="btn-sm btn-clear" onclick="clearRecords()">🗑 清空</button>
    </div>
  </div>
  <div class="record-table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>饲料</th><th>数字抽签</th><th>时间</th></tr>
      </thead>
      <tbody id="recordBody"></tbody>
    </table>
  </div>
</div>

<script>
var prizes = [
  {name:"日清EP1",spec:"咪咪小袋",qty:5},
  {name:"高够力底栖鱼小块",spec:"咪咪小袋",qty:5},
  {name:"高够力素食鼠片",spec:"咪咪小袋",qty:5},
  {name:"高够力荤食鼠片",spec:"咪咪小袋",qty:5},
  {name:"高够力素食大饼",spec:"咪咪小袋",qty:5},
  {name:"高够力仿红虫",spec:"咪咪小袋",qty:5},
  {name:"JBL荤食",spec:"大袋100g",qty:1},
  {name:"卓必克南极磷虾贴片",spec:"大袋100g",qty:1},
  {name:"日索鼠片",spec:"咪咪小袋",qty:5},
  {name:"莫斯特主食s号",spec:"咪咪小袋",qty:1},
  {name:"莫斯特大蒜素",spec:"咪咪小袋",qty:1}
];
var icons = ["🐟","🐠","🐡","🦈","🐋","🦑","🦀","🦞","🦐","🐙","🐬"];
var numWeights = [1,4,9,16,25];
var numTotal = 55;
var totalQty = 39;
var drawCount = 0;
var maxDraws = 1;
var phase2Used = false;
var animating = false;
var records = [];
var currentRecord = null;

try { records = JSON.parse(localStorage.getItem("foodLotteryRecords")||"[]"); } catch(e) { records = []; }

function renderGrid() {
  var g = document.getElementById("prizeGrid");
  var h = "";
  for (var i = 0; i < prizes.length; i++) {
    var p = prizes[i];
    h += '<div class="prize-card" id="card-'+i+'">';
    h += '<div class="icon">'+icons[i]+'</div>';
    h += '<div class="name">'+p.name+' &times;1</div>';
    h += '<div class="spec">'+p.spec+'</div>';
    h += '<div class="qty">共'+(p.qty||0)+'包</div>';
    h += '</div>';
  }
  g.innerHTML = h;
}

function renderProb() {
  var g = document.getElementById("probGrid");
  var h = "";
  for (var i = 0; i < prizes.length; i++) {
    var p = prizes[i];
    var pct = ((p.qty||0)/totalQty*100).toFixed(1);
    h += '<div class="prob-item">';
    h += '<span style="font-size:.85rem">'+icons[i]+'</span>';
    h += '<span class="prob-label">'+p.name+'</span>';
    h += '<div class="prob-bar-wrap"><div class="prob-bar" style="width:'+pct+'%"></div></div>';
    h += '<span class="prob-pct">'+pct+'%</span>';
    h += '</div>';
  }
  g.innerHTML = h;
}

function renderNumWheel() {
  var w = document.getElementById("numWheel");
  var h = "";
  for (var i = 0; i < 5; i++) {
    var n = i + 1;
    var pct = (numWeights[i]/numTotal*100).toFixed(1);
    h += '<div class="num-cell" id="nc-'+n+'">'+n+'<span class="prob-tiny">'+pct+'%</span></div>';
  }
  w.innerHTML = h;
}

function updateCounter() {
  document.getElementById("drawCounter").innerHTML = '第一阶段：可抽 <b>'+maxDraws+'</b> 次，已抽 <b>'+drawCount+'</b> 次';
}

function weightedRandom() {
  var r = Math.random() * totalQty;
  for (var i = 0; i < prizes.length; i++) {
    r -= prizes[i].qty || 0;
    if (r <= 0) return i;
  }
  return prizes.length - 1;
}

function doDraw() {
  if (animating || drawCount >= maxDraws) return;
  animating = true;
  var btn = document.getElementById("btnDraw");
  if (btn) btn.disabled = true;

  var cards = document.querySelectorAll(".prize-card");
  var frame = 0;
  var totalFrames = 30;
  var winner = weightedRandom();

  var timer = setInterval(function() {
    for (var i = 0; i < cards.length; i++) cards[i].classList.remove("lit");
    var lit = Math.floor(Math.random() * prizes.length);
    cards[lit].classList.add("lit");
    frame++;
    if (frame >= totalFrames) {
      clearInterval(timer);
      for (var i = 0; i < cards.length; i++) cards[i].classList.remove("lit");
      cards[winner].classList.add("won");
      onDrawDone(winner);
    }
  }, 70);
}

function onDrawDone(winner) {
  var p = prizes[winner];
  drawCount++;
  var box = document.getElementById("resultBox");
  if (box) box.classList.add("show");
  var slot = document.getElementById("slot1");
  if (slot) {
    slot.classList.add("show");
    slot.textContent = icons[winner] + " " + p.name + "（" + p.spec + "）";
    slot.classList.add("pulse");
    setTimeout(function() { slot.classList.remove("pulse"); }, 600);
  }
  updateCounter();
  animating = false;
  var btn = document.getElementById("btnDraw");
  if (btn) btn.disabled = true;
  unlockPhase2();
}

function unlockPhase2() {
  var t1 = document.getElementById("tab1");
  var t2 = document.getElementById("tab2");
  if (t1) { t1.classList.remove("active"); t1.classList.add("done"); }
  if (t2) t2.classList.add("active");
  var btn = document.getElementById("btnPhase2");
  if (btn) btn.style.display = "inline-block";
  currentRecord = {
    feed: prizes[weightedRandom()] ? prizes[weightedRandom()].name : "",
    num: null,
    time: new Date().toLocaleString("zh-CN", {hour12:false})
  };
  // fix: re-get the actual drawn prize
  for (var i = 0; i < prizes.length; i++) {
    var card = document.getElementById("card-"+i);
    if (card && card.classList.contains("won")) {
      currentRecord.feed = prizes[i].name;
      currentRecord.feedspec = prizes[i].spec;
      break;
    }
  }
}

function startPhase2() {
  var sec = document.getElementById("phase2Section");
  if (sec) sec.classList.add("show");
  var btn = document.getElementById("btnPhase2");
  if (btn) btn.style.display = "none";
  if (sec) sec.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function doPhase2Draw() {
  if (phase2Used || animating) return;
  animating = true;
  var btn = document.getElementById("btnDraw2");
  if (btn) btn.disabled = true;

  var r = Math.random() * numTotal;
  var winner = 1;
  for (var i = 0; i < 5; i++) {
    r -= numWeights[i];
    if (r <= 0) { winner = i + 1; break; }
  }

  var cells = document.querySelectorAll(".num-cell");
  var frame = 0;
  var totalFrames = 36;

  var timer = setInterval(function() {
    for (var i = 0; i < cells.length; i++) cells[i].classList.remove("lit");
    var lit = Math.floor(Math.random() * 5);
    cells[lit].classList.add("lit");
    frame++;
    if (frame >= totalFrames) {
      clearInterval(timer);
      for (var i = 0; i < cells.length; i++) cells[i].classList.remove("lit");
      var wonCell = document.getElementById("nc-"+winner);
      if (wonCell) wonCell.classList.add("won-num");
      onPhase2Done(winner);
    }
  }, 80);
}

function onPhase2Done(winner) {
  phase2Used = true;
  animating = false;
  var pct = (numWeights[winner-1]/numTotal*100).toFixed(1);
  var res = document.getElementById("phase2Result");
  var det = document.getElementById("phase2Detail");
  if (res) { res.textContent = "🎲 抽到数字：" + winner; res.classList.add("show"); }
  if (det) { det.textContent = "概率 " + pct + "%（数字越大中奖概率越高）"; det.classList.add("show"); }
  var t2 = document.getElementById("tab2");
  if (t2) { t2.classList.remove("active"); t2.classList.add("done"); }
  if (currentRecord) {
    currentRecord.num = winner;
    records.push(currentRecord);
    try { localStorage.setItem("foodLotteryRecords", JSON.stringify(records)); } catch(e) {}
    renderRecords();
  }
}

function renderRecords() {
  var tbody = document.getElementById("recordBody");
  var stat = document.getElementById("recordStat");
  if (!tbody) return;
  stat.textContent = "共 " + records.length + " 次完整抽奖";
  if (!records.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-tip">暂无记录</td></tr>';
    return;
  }
  var h = "";
  for (var i = records.length - 1; i >= 0; i--) {
    var r = records[i];
    var numBadge = "";
    if (r.num !== null && r.num !== undefined) {
      var cls = r.num <= 2 ? "badge-green" : r.num <= 3 ? "badge-blue" : r.num <= 4 ? "badge-amber" : "badge-red";
      numBadge = '<span class="badge '+cls+'">'+r.num+'</span>';
    } else {
      numBadge = '<span style="color:#ccc">—</span>';
    }
    h += '<tr><td>'+(records.length-i)+'</td>';
    h += '<td><span class="badge badge-blue">'+(r.feed||"—")+'</span></td>';
    h += '<td>'+numBadge+'</td>';
    h += '<td style="color:#aaa;font-size:.63rem">'+r.time+'</td></tr>';
  }
  tbody.innerHTML = h;
}

function exportCSV() {
  if (!records.length) { alert("暂无记录可导出"); return; }
  var bom = "\uFEFF";
  var csv = "#,饲料,数字抽签,时间\n";
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    csv += (i+1)+',"'+r.feed+'","'+(r.num||"—")+'",'+r.time+'\n';
  }
  var blob = new Blob([bom+csv], {type:"text/csv;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "鱼饲料抽奖记录_" + new Date().toLocaleDateString("zh-CN").replace(/\//g,"-") + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

function clearRecords() {
  if (!confirm("确定清空所有抽奖记录？此操作不可恢复。")) return;
  records = [];
  try { localStorage.removeItem("foodLotteryRecords"); } catch(e) {}
  renderRecords();
}

renderGrid();
renderProb();
renderNumWheel();
renderRecords();
updateCounter();
</script>
